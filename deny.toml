[advisories]
unmaintained = "all"
yanked = "deny"

[licenses]
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]
# ureq's TLS stack (rustls with ring), allowed per crate.
exceptions = [
  { crate = "ring", allow = ["ISC"] },
  { crate = "rustls-webpki", allow = ["ISC"] },
  { crate = "untrusted", allow = ["ISC"] },
  { crate = "subtle", allow = ["BSD-3-Clause"] },
  { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
]

[bans]
multiple-versions = "deny"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
