[package]
name = "hangar"
version = "0.1.0"
edition = "2024"
description = "Sandboxed workspaces for AI agents"
license = "MIT"
repository = "https://github.com/zahidkizmaz/hangar"
readme = "README.md"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
http = "1.5.0"
log = "0.4.34"
miniserde = "0.1.46"
percent-encoding = "2.3.2"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

# Dev tools, run through cargo-run-bin (`cargo install cargo-run-bin
# cargo-binstall`): `cargo nextest`, `cargo llvm-cov` and `cargo deny` use
# these versions, downloaded prebuilt by cargo-binstall.
[package.metadata.bin]
cargo-nextest = { version = "0.9.146", locked = true }
cargo-llvm-cov = { version = "0.9.1", locked = true }
cargo-deny = { version = "0.20.2", locked = true }
